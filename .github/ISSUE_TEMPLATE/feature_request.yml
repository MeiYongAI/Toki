name: 功能建议 / Feature Request
description: 建议新的功能、设置项或现有交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        功能只会基于官方 TikTok 46.4.3 评估和实现，不为其他 TikTok 版本增加专用兼容代码。

        请描述实际使用场景，而不只是给出功能名称。普通讨论和想法确认可先前往 Telegram 群。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认 / Prerequisites
      options:
        - label: 我已确认最新版本尚未提供此功能。
          required: true
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true
        - label: 此建议面向官方 TikTok 46.4.3，不要求适配旧版或修改版客户端。
          required: true
        - label: 此建议不涉及绕过登录、账号验证、付费功能或平台安全限制。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 功能范围 / Feature area
      options:
        - 信息流过滤 / Feed filtering
        - 播放控制 / Playback
        - 下载与保存位置 / Downloads and save locations
        - 评论翻译 / Comment translation
        - 页面净化 / Page purification
        - 地区与环境 / Region and environment
        - 设置界面 / Settings UI
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与问题 / Use case
      description: 说明目前的操作流程有什么困难，以及谁会使用这个功能。
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: 建议行为 / Proposed behavior
      description: 说明开关、入口、默认值以及开启和关闭后的具体表现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 是否有 TikTok 原生设置、现有 Toki 功能或其他操作可以部分解决？
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考资料 / References
      description: 可附截图、录屏或公开链接。不要上传 TikTok APK、反编译源码、账号信息或密钥。

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息 / Additional context
